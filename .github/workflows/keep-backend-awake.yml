# Pings the Render backend so the free instance doesn't go to sleep
# (Render free web services sleep after ~15 min without traffic, and the next
# visitor then waits 20–60 s). GitHub may delay scheduled runs, so this is
# best-effort; an external monitor such as cron-job.org is more punctual.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://charsada-chappal.onrender.com/api/health; then exit 0; fi
            sleep 10
          done
          echo "Backend did not answer after 3 attempts" && exit 1
